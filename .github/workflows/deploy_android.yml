## Github Actions CI workflow to deploy to Internal testing in the Play Store
name: CI_STORE_DEPLOY_ANDROID

on: workflow_dispatch

jobs:
  store_deploy_android:
    # Only run this job if the branch name starts with 'release/'
    name: android store release
    runs-on: ubuntu-latest
    permissions:
      # Needed to create GitHub releases and upload APKs to them
      contents: write
    env:
      # Setup env variables that will be used throughout the workflow
      JAVA_VERSION: 21.0
      # FLUTTER_VERSION: 3.29.2
      AAB_PATH: build/app/outputs/bundle/release/app-release.aab
      KEYSTORE_PATH: android/upload-keystore.jks
      KEY_PROPS_PATH: android/key.properties
      SERVICE_ACCOUNT_PATH: store_credentials.json
      APK_DIR: build/app/outputs/flutter-apk
    steps:
      # Checkout repository codebase
      - name: Checkout the code
        uses: actions/checkout@v3

      # Setup Java in the VM
      - name: Setup Java to compile the Android project
        uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      # Setup Flutter in the VM
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Decode Android env variables
      - name: Decode Android keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > ${{ env.KEYSTORE_PATH }}

      - name: Decode Android key properties
        run: echo "${{ secrets.KEYPROPS }}" | base64 --decode > ${{ env.KEY_PROPS_PATH }}

      # Decode Android release Service Account
      - name: Decode Android Service Account
        run: echo "${{ secrets.SERVICE_ACCOUNT }}" | base64 --decode > ${{ env.SERVICE_ACCOUNT_PATH }}

      # Run flutter commands
      - name: Run flutter pub get
        run: flutter pub get

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 📉 Run all app tests
        run: flutter test --concurrency=1

      # Build Android Bundle release file
      - name: Build aab
        run: |
          flutter build appbundle --release

      # Upload generated aab to project artifacts
      - name: Upload generated aab to the artifacts
        uses: actions/upload-artifact@master
        with:
          name: aab-stores
          path: ${{ env.AAB_PATH }}

      # Build per-ABI release APKs for the GitHub release
      - name: Build apks
        run: |
          flutter build apk --release --split-per-abi

      # Create (or update) the GitHub release for the current pubspec version
      # and upload the APKs to it. The tag is the plain version (e.g. 1.8.3),
      # matching what bump_version.sh creates; if the tag hasn't been pushed
      # yet, it is created at the commit this workflow ran on.
      - name: Upload apks to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version: //' | cut -d '+' -f 1)
          mkdir -p release-apks
          for apk in ${{ env.APK_DIR }}/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "release-apks/quran_revision_companion-${VERSION}-${abi}.apk"
          done
          ls -l release-apks
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" release-apks/*.apk --clobber
          else
            gh release create "$VERSION" release-apks/*.apk \
              --title "$VERSION" \
              --target "${{ github.sha }}" \
              --generate-notes
          fi

      # Deploy bundle to Google Play internal testing
      - name: Deploy to Play Store (Internal testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{env.SERVICE_ACCOUNT_PATH}}
          packageName: com.wqar.quran_mem_helper
          releaseFiles: ${{ env.AAB_PATH }}
          track: production
          status: completed
